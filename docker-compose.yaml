networks:
  internal:
    driver: bridge
  gateway-network:
    driver: bridge


services:
  db:
    image: 'bitnami/postgresql:latest'
    restart: always
    environment:
      POSTGRES_PASSWORD: changeme
      POSTGRES_USER: postgres
    ports:
      - "5432"
    networks:
      - internal

  adminer:
    image: adminer:latest
    restart: always
    ports:
      - 8888:8080
    networks:
      - internal
      - gateway-network

  redis:
    image: redis:latest
    ports:
      - "6379"
    networks:
      - internal

  broker:
    image: apache/kafka:latest
    hostname: broker
    container_name: broker
    ports:
      - "9092"
    networks:
      - internal
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      KAFKA_LISTENERS: PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  fraud-db:
    image: 'bitnami/postgresql:latest'
    environment:
      POSTGRES_DB: frauddb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
    ports:
      - "5433:5432"
    networks:
      - internal

  auth-db:
    image: 'bitnami/postgresql:latest'
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
    ports:
      - "5434:5432"
    networks:
      - internal

  grafana-lgtm:
    image: 'grafana/otel-lgtm:latest'
    ports:
      - "3000:3000"
      - "4317"
      - "4318:4318"
    networks:
      - internal
      - gateway-network

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - internal
      - gateway-network
    depends_on:
      - auth-service
      - payment-service
      - fraud-service

  auth-service:
    build:
      context: ./authservice
      dockerfile: Dockerfile
    expose:
      - "8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - internal
    depends_on:
      - auth-db
      - broker

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    expose:
      - "8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - internal
    depends_on:
      - db
      - redis
      - broker

  fraud-service:
    build:
      context: ./frauddetectionsystem
      dockerfile: Dockerfile
    expose:
      - "8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - internal
    depends_on:
      - fraud-db
      - broker

  notification-service:
    build:
      context: ./notificationservice
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - internal
    depends_on:
      - broker