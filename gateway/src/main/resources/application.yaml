server:
  port: 8080

spring:
  application:
    name: gateway

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**

        - id: payment-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/payments/**,/api/accounts/**

        - id: fraud-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/fraud/**

jwt:
  secret: your-base64-encoded-secret-key-here